name: Web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

jobs:
  mockup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mockup

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/mockup/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
