name: Web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Build the WASM core
        run: make wasm
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: npm ci

      - name: Check (format, lint, types, tests, build, budget)
        run: npm run check

      - name: Smoke test (WASM round trip)
        run: npm run smoke
