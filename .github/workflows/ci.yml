name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: WASM build check
        run: make wasm-check

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: Install attribution tooling
        run: make license-tools

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Integration test
        run: make integration-test

      - name: Fuzz seed validation
        run: make fuzz-seed
