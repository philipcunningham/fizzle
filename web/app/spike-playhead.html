<!doctype html>
<html>
  <head>
    <title>playhead spike</title>
    <style>
      body {
        background: #0d1117;
        color: #c9d1d9;
        font: 14px ui-monospace, monospace;
        margin: 40px;
      }
      h1 {
        font-size: 15px;
        font-weight: normal;
        color: #8b949e;
      }
      #strip {
        width: 900px;
        margin: 24px 0;
      }
      button {
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        padding: 10px 18px;
        font: inherit;
        cursor: pointer;
      }
      button:active {
        background: #2ea043;
        color: #fff;
      }
      #read {
        margin-top: 18px;
        color: #8b949e;
        white-space: pre;
      }
      .key {
        color: #58a6ff;
      }
      .sus {
        color: #33d17a;
      }
      .rel {
        color: #7aa2ff;
      }
    </style>
  </head>
  <body>
    <h1>
      playhead spike: wavesurfer's own cursor, driven by the modelled position.
      <span class="sus">green</span> is the sustain loop, <span class="rel">blue</span> the end loop.
    </h1>
    <div id="strip"></div>
    <button id="hold">hold to play</button>
    <span class="key">(press and hold, then let go)</span>
    <div id="read"></div>
    <script type="module" src="/spike-playhead.mjs"></script>
  </body>
</html>
