StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = fizzle

[*.md]
BasedOnStyles = fizzle

# Verbatim raw source documents in llm-wiki/sources/ are never linted.
# Non-markdown raw documents (PDFs, scans) are outside vale's formats
# already; list any future raw markdown transcription here.
[llm-wiki/sources/casio-fz1-data-structures.md]
BasedOnStyles =

# CLAUDE.md files are symlinks to AGENTS.md; linting them would report
# every alert twice.
[*CLAUDE.md]
BasedOnStyles =

# Scratch directories that agent tooling owns aren't project prose, and
# their formats aren't ours to dictate. Listed here so the Makefile's
# pass and the per-file hook (scripts/valehook) both skip them without
# each carrying its own copy of the list.
[.superpowers/**]
BasedOnStyles =

[.claude/worktrees/**]
BasedOnStyles =
